<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunday Revenue Report · Brightwild</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* Colors follow the Brightwild design tokens (packages/design/styles/tokens.css). */
    :root {
      --bg: #f8f7f3;
      --surface: #fcfcfc;
      --text: #141414;
      --text-2: rgba(20, 20, 20, 0.70);
      --text-3: rgba(20, 20, 20, 0.56);
      --border: rgba(20, 20, 20, 0.10);
      --grid: rgba(20, 20, 20, 0.06);
      --cy: #1469bc;
      --stly: #5e5e5e;
      --ly: #c4c4c4;
      --up: #306b4b;
      --down: #c8191f;
      --tab-bg: rgba(20, 20, 20, 0.06);
      /* Always light: the report is read and screenshotted as a light page. */
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    header { padding: 32px 0 24px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); }
    .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
    .meta { color: var(--text-3); margin-top: 4px; }
    .tabs { display: inline-flex; background: var(--tab-bg); border-radius: 8px; padding: 3px; gap: 2px; }
    .tab {
      appearance: none; border: 0; background: transparent; color: var(--text-2);
      font: inherit; font-weight: 500; padding: 6px 18px; border-radius: 6px; cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .tab:focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }
    main { padding: 24px 0 48px; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .stat-label { color: var(--text-3); font-size: 12px; font-weight: 500; }
    .stat-value { font-size: 24px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--text-2); font-size: 12px; margin-top: 6px; }
    .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 8px; min-width: 0; }
    .card.wide { grid-column: 1 / -1; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .card h2 { font-size: 15px; font-weight: 600; }
    .card-totals { color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
    .note { color: var(--text-3); font-size: 12px; margin-top: 2px; }
    .chart { position: relative; height: 420px; margin-top: 8px; }
    .card.wide .chart { height: 480px; }
    .up { color: var(--up); } .down { color: var(--down); }
    .status { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; color: var(--text-2); text-align: center; }
    footer { color: var(--text-3); font-size: 12px; padding: 16px 0 32px; border-top: 1px solid var(--border); }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .wrap { padding: 0 16px; }
      h1 { font-size: 22px; }
      .stat-value { font-size: 20px; }
      .chart, .card.wide .chart { height: 380px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">Brightwild</div>
      <div class="title-row">
        <div>
          <h1>Sunday Revenue Report</h1>
          <p class="meta" id="meta">Loading…</p>
        </div>
        <div class="tabs" id="tabs" role="tablist" aria-label="Report year"></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="content"><div class="status">Loading revenue…</div></div>
  </main>

  <footer>
    <div class="wrap">
      Source: BigQuery <code>brightwild_analytics_mart.units_nights_pacing</code>, refreshed daily.
      CY is revenue on the books today. STLY is what was on the books 364 days ago for the same nights a year earlier. LY Final is those nights' final revenue.
    </div>
  </footer>

  <script>
    const fmt = (n) => {
      const v = Number(n) || 0, a = Math.abs(v);
      if (a >= 1e6) return `$${(v / 1e6).toFixed(a >= 1e7 ? 1 : 2)}M`;
      if (a >= 1e3) return `$${Math.round(v / 1e3)}K`;
      return `$${Math.round(v)}`;
    };
    const sum = (xs) => (xs || []).reduce((t, x) => t + (Number(x) || 0), 0);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    function pace(cy, base) {
      if (!base) return null;
      return (cy - base) / base;
    }
    function paceHtml(p) {
      if (p == null) return "—";
      const pct = `${p >= 0 ? "+" : ""}${(p * 100).toFixed(1)}%`;
      return `<span class="${p >= 0 ? "up" : "down"}">${pct}</span>`;
    }

    let report = null;
    let charts = [];

    function renderTabs(active) {
      const years = Object.keys(report.years).sort();
      document.getElementById("tabs").innerHTML = years.map((y) =>
        `<button class="tab" role="tab" data-year="${esc(y)}" aria-selected="${y === active}" tabindex="${y === active ? 0 : -1}">${esc(y)}</button>`
      ).join("");
    }

    function chartFor(canvas, group, wide) {
      const series = [
        { label: "CY", data: group.cy, color: css("--cy") },
        { label: "STLY", data: group.stly, color: css("--stly") },
        { label: "LY Final", data: group.lyFinal, color: css("--ly") },
      ];
      const text = css("--text-2");
      return new Chart(canvas, {
        type: "bar",
        data: {
          labels: group.months,
          datasets: series.map((s) => ({ label: s.label, data: s.data, backgroundColor: s.color, borderRadius: 2, barPercentage: 0.9, categoryPercentage: 0.8 })),
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          layout: { padding: { right: 44 } },
          // Bars run horizontally, so hover must resolve the month from the
          // vertical position; the default (x) picks a month by bar length.
          interaction: { mode: "index", axis: "y", intersect: false },
          scales: {
            x: { beginAtZero: true, grid: { color: css("--grid") }, border: { display: false }, ticks: { color: text, callback: (v) => fmt(v), maxTicksLimit: 6 } },
            y: { grid: { display: false }, border: { display: false }, ticks: { color: text } },
          },
          plugins: {
            legend: { display: false },
            tooltip: { mode: "index", axis: "y", intersect: false, callbacks: { label: (c) => `${c.dataset.label}: ${fmt(c.parsed.x)}` } },
          },
        },
        plugins: [{
          id: "values",
          afterDatasetsDraw(chart) {
            const { ctx } = chart;
            ctx.save();
            ctx.font = `500 ${wide ? 10 : 9}px Inter, sans-serif`;
            ctx.fillStyle = text;
            ctx.textBaseline = "middle";
            chart.data.datasets.forEach((d, i) => {
              chart.getDatasetMeta(i).data.forEach((bar, j) => {
                const v = Number(d.data[j]) || 0;
                if (v > 0) ctx.fillText(fmt(v), bar.x + 4, bar.y);
              });
            });
            ctx.restore();
          },
        }],
      });
    }

    function renderYear(year) {
      if (!report.years[year]) year = report.defaultYear;
      renderTabs(year);
      charts.forEach((c) => c.destroy());
      charts = [];

      const groups = report.years[year].unitGroups;
      const all = groups.ALL_PROPERTIES;
      const totals = all ? { cy: sum(all.cy), stly: sum(all.stly), ly: sum(all.lyFinal) } : null;
      const summary = totals ? `
        <div class="summary">
          <div class="stat"><div class="stat-label">CY ${esc(year)} on the books</div><div class="stat-value">${fmt(totals.cy)}</div></div>
          <div class="stat"><div class="stat-label">STLY</div><div class="stat-value">${fmt(totals.stly)}</div></div>
          <div class="stat"><div class="stat-label">LY Final</div><div class="stat-value">${fmt(totals.ly)}</div></div>
          <div class="stat"><div class="stat-label">Pace vs STLY</div><div class="stat-value">${paceHtml(pace(totals.cy, totals.stly))}</div></div>
        </div>` : "";

      const legendHtml = `
        <div class="legend" aria-hidden="true">
          <span style="--c: var(--cy)">CY ${esc(year)} (on the books)</span>
          <span style="--c: var(--stly)">STLY</span>
          <span style="--c: var(--ly)">LY Final</span>
        </div>`;
      const cards = Object.entries(groups).map(([key, g], i) => {
        const cy = sum(g.cy), stly = sum(g.stly), ly = sum(g.lyFinal);
        const notes = [];
        if (!stly && ly) notes.push("No STLY: nothing was on the books a year ago.");
        if (!stly && !ly) notes.push("No prior-year revenue.");
        if (!cy && (stly || ly)) notes.push(`Nothing on the books for ${year}.`);
        return `
          <section class="card${key === "ALL_PROPERTIES" ? " wide" : ""}">
            <div class="card-head">
              <h2>${esc(g.name)}</h2>
              <div class="card-totals">CY ${fmt(cy)} · STLY ${fmt(stly)} · LY ${fmt(ly)} · ${paceHtml(pace(cy, stly))}</div>
            </div>
            ${legendHtml}
            ${notes.map((n) => `<p class="note">${esc(n)}</p>`).join("")}
            <div class="chart"><canvas id="chart-${i}" aria-label="${esc(g.name)} ${esc(year)} revenue by month: CY, STLY and LY Final" role="img"></canvas></div>
          </section>`;
      }).join("");

      document.getElementById("content").innerHTML = `${summary}
        <div class="grid">${cards}</div>`;

      Object.entries(groups).forEach(([key, g], i) => {
        charts.push(chartFor(document.getElementById(`chart-${i}`), g, key === "ALL_PROPERTIES"));
      });
    }

    function selectedYear() {
      const hash = decodeURIComponent(location.hash.slice(1));
      return report.years[hash] ? hash : report.defaultYear;
    }

    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (btn) location.hash = btn.dataset.year;
    });
    document.getElementById("tabs").addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const years = Object.keys(report.years).sort();
      const i = years.indexOf(selectedYear());
      const next = years[(i + (e.key === "ArrowRight" ? 1 : -1) + years.length) % years.length];
      location.hash = next;
      requestAnimationFrame(() => document.querySelector(`.tab[data-year="${next}"]`)?.focus());
    });
    window.addEventListener("hashchange", () => report && renderYear(selectedYear()));

    (async () => {
      try {
        const res = await fetch("/api/data");
        if (!res.ok) throw new Error(`/api/data returned ${res.status}`);
        report = await res.json();
        const snap = report.snapshotDate
          ? new Date(`${report.snapshotDate}T12:00:00`).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" })
          : "unknown";
        document.getElementById("meta").textContent = `Revenue on the books as of ${snap}`;
        renderYear(selectedYear());
      } catch (err) {
        console.error(err);
        document.getElementById("meta").textContent = "Data unavailable";
        document.getElementById("content").innerHTML = `<div class="status">Revenue data could not be loaded. Try again in a minute.</div>`;
      }
    })();
  </script>
</body>
</html>
